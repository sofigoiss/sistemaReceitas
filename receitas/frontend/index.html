<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela de Receitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
    <a href="#" class="logo">❦ Receitas</a>

<nav>
    <a href="#inicio">Início</a>
</nav>

</header>

<section class="apresentacao" id="inicio">
    <span class="subtitulo">MEU CADERNO DE RECEITAS</span>
    <h1>Sabores que contam histórias</h1>
    <p>
        Receitas especiais, momentos doces e pequenos prazeres
        guardados em um só lugar.
    </p>
    <span class="detalhe">✦ ───── ❦ ───── ✦</span>
</section>

    <div class="container">
        <h1>Minhas Receitas</h1>

        <form id="form-receita">
            <div class="form-group">
                <label for="nome">Nome da Receita:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" placeholder="Ex: Sobremesa, Massa" required>
            </div>

            <div class="form-group">
                <label for="tempo_preparo">Tempo de Preparo (minutos):</label>
                <input type="number" id="tempo_preparo" required>
            </div>

            <div class="form-group">
                <label for="dificuldade">Dificuldade:</label>
                <select id="dificuldade" required>
                    <option value="Fácil">Fácil</option>
                    <option value="Média">Média</option>
                    <option value="Difícil">Difícil</option>
                </select>
            </div>

            <button type="submit" class="btn">Adicionar Receita</button>
        </form>

        <hr>

        <h2>Lista de Receitas</h2>
        <div id="lista-receitas" class="grid-receitas"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
